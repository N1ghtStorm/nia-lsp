[package]
name = "nia-lsp"
version = "0.1.0"
edition = "2024"
description = "Language server for Nia"
publish = false

[dependencies]
nialang = { path = "../nialang" }
tokio = { version = "1", features = ["io-std", "macros", "rt", "sync"] }
tower-lsp-server = "0.23"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "time"] }
